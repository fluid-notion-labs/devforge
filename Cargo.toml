[workspace]
resolver = "3"
members = ["crates/devforge-core", "crates/devforge-tui"]
# gpui is a future member (M4) — kept out so `cargo build` fetches no zed deps:
# when ready, uncomment the second line and the gpui crate's own workspace-hack.
# exclude = ["crates/devforge-gpui"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
indexmap = { version = "2", features = ["serde"] }
shell-words = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-rusqlite = "0.8"
rusqlite_migration = "2"
tempfile = "3"
ratatui = "0.29"
crossterm = "0.29"
gpui = { git = "https://github.com/zed-industries/zed" }
